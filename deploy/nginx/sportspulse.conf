# ==============================================================================
# SportsPulse — Nginx Production Reverse Proxy Configuration
# ==============================================================================
# Path: /etc/nginx/sites-available/sportspulse
# Symlink: /etc/nginx/sites-enabled/sportspulse
#
# Features:
# - Supports Initial VPS IP Deployment (HTTP) and Production Domain Deployment (HTTPS)
# - Unbuffered Server-Sent Events (SSE) for Real-Time Live Scoring & Overlay Push
# - OBS Studio & vMix Browser-Source Output Optimization
# - Hardened Static Protection (Blocks direct HTTP access to data/db.json, .env, backups)
# - Anti-Script-Execution Security for uploads/ Directory
# ==============================================================================

# ------------------------------------------------------------------------------
# OPTION 1: INITIAL DEPLOYMENT (IP-ONLY / PRE-DOMAIN TESTING ON PORT 80)
# (Use this block before configuring DNS or if running without a domain)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_VPS_IP; # Replace with your VPS Public IP (e.g., 203.0.113.10)

    # File Upload Limit (Compatible with 10MB logos, sponsor overlays, headshots)
    client_max_body_size 10M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Defense-in-depth: Deny direct access to internal database, environment files & scripts
    location ~* ^/(data|\.env|backups|server|scripts|node_modules) {
        deny all;
        return 403;
    }

    # Uploads directory: Serve images directly, forbid script execution
    location /uploads/ {
        alias /var/www/sportspulse/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;

        # Disallow execution of scripts inside uploads directory
        location ~* \.(php|pl|py|cgi|sh|bash|exe|bin|bat)$ {
            deny all;
            return 403;
        }

        try_files $uri =404;
    }

    # Static assets caching
    location /assets/ {
        alias /var/www/sportspulse/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Real-Time SSE Streams: CRITICAL UNBUFFERED PROXY
    location ~* ^/api/matches/[^/]+/(scoring/stream|broadcast/stream) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable all proxy and fastcgi buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep connection open for long-running tournament broadcasts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Standard Application Routing & Public Broadcast Canvases (/broadcast/match/:id)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}

